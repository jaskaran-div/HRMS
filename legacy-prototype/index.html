<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>HR Employee Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--ink:#1e2a3b;--mute:#6b778c;--line:#e6eaf2;--brand:#3b5bdb;--brand-d:#2f49b8;--soft:#eef2ff;--ok:#0f9d6b;--okbg:#e3f7ef;--bad:#d64545;--badbg:#fdeaea;--warnbg:#fff4e0;--warn:#b7791f;--shadow:0 1px 3px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14.5px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;transition:.15s}
.btn:hover{border-color:#c9d2e6;background:#fafbfe}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--badbg);border-color:#f3c1c1}
.btn.sm{padding:5px 10px;font-size:13px}

/* sidebar */
aside{width:248px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.logo.has-img{background:#fff;border:1px solid var(--line);overflow:hidden;padding:2px}
.logo img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--mute);font-size:12px}
.nav-h{font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;color:#3b4760;font-weight:500}
.nav:hover{background:#f3f5fa}
.nav.on{background:var(--soft);color:var(--brand)}
.nav .ic{width:20px;text-align:center}
.nav .ct{margin-left:auto;background:#eceff6;color:var(--mute);font-size:12px;padding:1px 8px;border-radius:20px}
.nav.on .ct{background:#dbe3ff;color:var(--brand)}
.side-foot{margin-top:auto;font-size:12px;color:var(--mute);padding:8px}

/* main */
.content{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 28px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:6}
.topbar h1{font-size:18px;margin:0;white-space:nowrap}
.search{margin-left:auto;display:flex;gap:8px;position:relative;width:min(440px,100%)}
.search input{flex:1;font:inherit;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#f8f9fc}
.search input:focus,.field:focus{outline:2px solid #c7d2ff;border-color:var(--brand);background:#fff}
.suggest{position:absolute;top:100%;left:0;right:70px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;z-index:9;overflow:hidden;box-shadow:var(--shadow)}
.suggest div{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.suggest div:hover{background:var(--soft)}
main{padding:24px 28px;max-width:1180px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h2{margin:0;font-size:21px}
.page-h .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.muted{color:var(--mute)}
.empty{text-align:center;padding:56px 16px}
.empty .big{font-size:44px}
.empty h2{margin:8px 0 6px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.kpi .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft)}
.kpi small{color:var(--mute);display:block}
.kpi b{font-size:22px}
.dept-row{display:grid;grid-template-columns:150px 1fr 40px;gap:12px;align-items:center;padding:7px 0}
.bar{height:9px;border-radius:5px;background:#edf0f7;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar.ok i{background:var(--ok)}

/* list */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.field,select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.tools .field{flex:1;min-width:200px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;background:#f8f9fc}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f6f8ff}
.who-c{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.gray{background:#eef0f5;color:var(--mute)}

/* employee page */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .av{width:64px;height:64px;font-size:22px}
.hero h2{margin:0;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:10px 16px;color:var(--mute);white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.kv small{display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.kv span{font-weight:500;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#f6f8fd;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
h3{margin:0 0 8px;font-size:15px}
.warn{color:var(--bad)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,60,.4);display:grid;place-items:center;z-index:30;padding:12px}
.mbox{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:660px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.mbox h3{font-size:18px;margin-bottom:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mgrid label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px;font-weight:600}
.mgrid input{font:inherit;font-size:14.5px;font-weight:400;color:var(--ink);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.mgrid input:focus{outline:2px solid #c7d2ff;border-color:var(--brand)}
.mgrid input[readonly]{background:#f3f5fa}

/* payslip */
#payslip{background:#fff;color:#111;border:1px solid #cfd5e2;padding:30px;max-width:800px;margin:0 auto;font-size:14px}
#payslip h3{margin:0;font-size:22px;text-align:center}
#payslip .sub{text-align:center;color:#555;margin-bottom:14px}
#payslip table td,#payslip table th{border:1px solid #cfd5e2;color:#111;white-space:normal;text-transform:none;letter-spacing:0;font-size:14px}
#payslip th{background:#f0f3fa}
#payslip .tot td{font-weight:700;background:#f7f8fc}
#payslip .net{margin-top:12px;padding:10px 12px;border:2px solid #111;display:flex;justify-content:space-between;font-weight:700;font-size:16px}
#payslip .sig{display:flex;justify-content:space-between;margin-top:46px;color:#444}
#payslip .info{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:14px}
#payslip .info div{display:flex;justify-content:space-between;border-bottom:1px dotted #bbb;padding:2px 0}

@media (max-width:860px){
  body{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0}.nav-h,.side-foot,.nav .ct{display:none}
  .nav{width:auto}
  .topbar,main{padding-left:14px;padding-right:14px}
  .topbar h1{display:none}.search{margin-left:0}
  #payslip .info{grid-template-columns:1fr}
}
@media print{
  body *{visibility:hidden}
  #payslip,#payslip *{visibility:visible}
  #payslip{position:absolute;left:0;top:0;width:100%;max-width:none;border:0;padding:10mm}
  @page{margin:8mm}
}
</style>
</head>
<body>

<aside>
  <div class="brand"><div class="logo" id="coLogo">HR</div><div><b id="coTitle">Your Company</b><small>HR Portal</small></div></div>
  <button class="nav" data-p="dash"><span class="ic">📊</span>Dashboard</button>
  <button class="nav" data-p="list"><span class="ic">👥</span>All Employees<span class="ct" id="ct">0</span></button>
  <button class="nav" id="navAdd"><span class="ic">➕</span>Add Employee</button>
  <div class="nav-h">Data</div>
  <button class="nav" id="btnUpload"><span class="ic">📤</span>Upload Sheet</button>
  <button class="nav" id="btnExport"><span class="ic">📥</span>Export Excel</button>
  <button class="nav" id="btnSample"><span class="ic">📄</span>Sample Template</button>
  <button class="nav" id="btnDemo"><span class="ic">🧪</span>Load Demo Data</button>
  <button class="nav" id="btnClear"><span class="ic">🗑</span>Clear All Data</button>
  <button class="nav" data-p="co"><span class="ic">🏢</span>Company Details</button>
  <div class="side-foot" id="status"></div>
  <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
</aside>

<div class="content">
  <div class="topbar">
    <h1 id="pageTitle">Dashboard</h1>
    <div class="search">
      <input id="q" placeholder="Search by Employee ID — e.g. EMP001" autocomplete="off" disabled>
      <button id="go" class="btn primary">Search</button>
      <div class="suggest" id="suggest" hidden></div>
    </div>
  </div>
  <main id="view"></main>
</div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
const num = v => { const n = parseFloat(String(v ?? '').replace(/[₹,\s]/g, '')); return isNaN(n) ? 0 : n; };
const money = n => '₹ ' + (Number(n) || 0).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const moneyS = n => '₹ ' + (Math.round(Number(n)) || 0).toLocaleString('en-IN');
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch { alert('Browser storage is full or blocked; data will not persist.') } }
};
function fmtDate(v){
  if (v instanceof Date && !isNaN(v)) return v.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  return String(v ?? '');
}
function monthLabel(v){
  if (v instanceof Date && !isNaN(v)) return v.toLocaleDateString('en-GB', {month:'short', year:'numeric'});
  return String(v ?? '').trim();
}
function monthKey(label){ const t = Date.parse('1 ' + label); return isNaN(t) ? null : t; }
const sortRecs = e => e.records.sort((a, b) => (monthKey(a.month) ?? 0) - (monthKey(b.month) ?? 0));

function words(n){
  n = Math.round(Number(n) || 0);
  if (n === 0) return 'Zero';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x/10)] + (x%10 ? ' ' + a[x%10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x/100)] + ' Hundred' + (x%100 ? ' ' : '') : '') + (x%100 ? two(x%100) : '');
  const parts = [[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand']];
  let out = [];
  for (const [d, name] of parts){ if (n >= d){ out.push(three(Math.floor(n/d)) + ' ' + name); n %= d; } }
  if (n) out.push(three(n));
  return out.join(' ');
}

/* ---------- column mapping ---------- */
const FIELDS = {
  id:['employeeid','empid','empcode','employeecode','id','empno','employeeno','staffid','code'],
  name:['name','employeename','empname','fullname'],
  dept:['department','dept'],
  desig:['designation','position','role','jobtitle','title'],
  email:['email','emailid','mail','officialemail'],
  phone:['phone','mobile','contact','phoneno','mobileno','contactno'],
  doj:['dateofjoining','doj','joiningdate','joindate'],
  dob:['dateofbirth','dob','birthdate'],
  location:['location','branch','office','workplace'],
  manager:['manager','reportingmanager','reportsto'],
  bank:['bank','bankname'],
  account:['accountno','accountnumber','bankaccount','bankaccountno','acno'],
  ifsc:['ifsc','ifsccode'],
  pan:['pan','panno','pannumber'],
  pfno:['pfno','pfnumber','uan'],
  month:['month','payperiod','period','salarymonth'],
  workdays:['workingdays','totalworkingdays','totaldays','daysinmonth'],
  present:['presentdays','present','dayspresent','daysworked'],
  absent:['absentdays','absent','daysabsent','lop','lopdays'],
  leaves:['leavestaken','leaves','leavedays','leave','paidleave'],
  halfdays:['halfdays','halfday'],
  late:['lateentries','latemarks','late','latecount'],
  leavebal:['leavebalance','leavesbalance','balanceleave','leavesremaining'],
  grossIn:['gross','grosssalary','grosspay'],
  netIn:['net','netsalary','netpay','takehome','netamount']
};
const EARN = [
  ['basic','Basic Salary',['basic','basicsalary','basicpay']],
  ['hra','House Rent Allowance',['hra','houserentallowance']],
  ['da','Dearness Allowance',['da','dearnessallowance']],
  ['conv','Conveyance Allowance',['conveyance','conveyanceallowance','transportallowance']],
  ['med','Medical Allowance',['medical','medicalallowance']],
  ['special','Special Allowance',['specialallowance','special']],
  ['bonus','Bonus / Incentive',['bonus','incentive','performancebonus']],
  ['otherEarn','Other Allowances',['otherallowance','otherallowances','allowances','otherearnings']]
];
const DEDUCT = [
  ['pf','Provident Fund',['pf','providentfund','pfdeduction','employeepf']],
  ['esi','ESI',['esi','esideduction']],
  ['pt','Professional Tax',['professionaltax','pt']],
  ['tds','Income Tax (TDS)',['tds','incometax','tax']],
  ['loan','Loan / Advance',['loan','advance','loanrecovery','salaryadvance']],
  ['lopAmt','Loss of Pay',['lossofpay','lopamount','lopdeduction']],
  ['otherDed','Other Deductions',['otherdeduction','otherdeductions','deductions']]
];
const LOOKUP = {};
Object.entries(FIELDS).forEach(([k, al]) => al.forEach(a => LOOKUP[norm(a)] = ['f', k]));
EARN.forEach(([k,l,al]) => [...al, l].forEach(a => LOOKUP[norm(a)] = ['e', k]));
DEDUCT.forEach(([k,l,al]) => [...al, l].forEach(a => LOOKUP[norm(a)] = ['d', k]));

/* ---------- parse sheet ---------- */
function parseRows(rows){
  const db = {}; let skipped = 0;
  for (const row of rows){
    const rec = {f:{}, e:{}, d:{}, x:{}};
    for (const [h, v] of Object.entries(row)){
      if (v === '' || v == null) continue;
      const hit = LOOKUP[norm(h)];
      if (hit) rec[hit[0]][hit[1]] = v; else rec.x[String(h).trim()] = v;
    }
    const id = String(rec.f.id ?? '').trim().toUpperCase();
    if (!id){ skipped++; continue; }
    const emp = db[id] ??= {id, info:{}, extra:{}, records:[]};
    for (const [k, v] of Object.entries(rec.f))
      if (!['month','workdays','present','absent','leaves','halfdays','late','leavebal','grossIn','netIn'].includes(k))
        emp.info[k] = (k === 'doj' || k === 'dob') ? fmtDate(v) : String(v);
    for (const [k, v] of Object.entries(rec.x)) emp.extra[k] = fmtDate(v);
    const f = rec.f, earn = {}, ded = {};
    Object.entries(rec.e).forEach(([k, v]) => earn[k] = num(v));
    Object.entries(rec.d).forEach(([k, v]) => ded[k] = num(v));
    emp.records.push({
      month: f.month ? monthLabel(f.month) : 'Current',
      earn, ded,
      grossIn: num(f.grossIn), netIn: num(f.netIn),
      att: {workdays: num(f.workdays), present: num(f.present), absent: num(f.absent),
            leaves: num(f.leaves), halfdays: num(f.halfdays), late: num(f.late),
            leavebal: f.leavebal === undefined ? null : num(f.leavebal)}
    });
  }
  Object.values(db).forEach(sortRecs);
  return {db, skipped};
}
function totals(r){
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  let gross = sum(r.earn), ded = sum(r.ded);
  if (!gross && r.grossIn) gross = r.grossIn;
  let net = gross - ded;
  if (!gross && r.netIn) net = r.netIn;
  return {gross, ded, net};
}
const attPct = r => r && r.att.workdays ? Math.min(100, Math.round(r.att.present / r.att.workdays * 100)) : null;

/* ---------- state ---------- */
let DB = store.get('hr_db', {});
const CO_DEFAULT = {name:'Your Company Pvt. Ltd.', addr:'Registered Office Address, City, State - 000000', phone:'', email:'', website:'', regno:'', logo:'', signatory:'', signDesig:'Authorised Signatory', footer:'This is a computer-generated payslip.'};
let COMPANY = {...CO_DEFAULT, ...store.get('hr_company', {})};
let cur = null, tab = 'profile', month = null, page = 'dash';
let listQ = '', listDept = '';
const persist = () => store.set('hr_db', DB);
const count = () => Object.keys(DB).length;

function refreshHeader(){
  const n = count();
  $('#status').textContent = n ? n + ' employees · saved in this browser only. Use Export Excel to back up.' : 'No data yet';
  $('#ct').textContent = n;
  $('#q').disabled = !n;
  $('#coTitle').textContent = COMPANY.name;
  const lg = $('#coLogo');
  if (COMPANY.logo){ lg.innerHTML = `<img src="${COMPANY.logo}" alt="">`; lg.classList.add('has-img'); }
  else { lg.textContent = 'HR'; lg.classList.remove('has-img'); }
}
function go(p, emp){
  page = p; if (emp){ cur = emp; tab = 'profile'; month = emp.records.at(-1)?.month; }
  render();
}
document.querySelectorAll('.nav[data-p]').forEach(b => b.onclick = () => go(b.dataset.p));

/* ---------- upload / sample / demo ---------- */
$('#btnUpload').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (count() && !confirm('This replaces all current data (including any edits you made here). Use "Export Excel" first if you want a backup. Continue?')){ e.target.value = ''; return; }
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array', cellDates:true});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    const {db, skipped} = parseRows(rows);
    if (!Object.keys(db).length){ alert('No employees found. Make sure the sheet has an "Employee ID" column in the first row.'); return; }
    DB = db; persist(); cur = null; page = 'list';
    refreshHeader(); render();
    alert(Object.keys(db).length + ' employees loaded from "' + f.name + '"' + (skipped ? '\n' + skipped + ' rows skipped (no Employee ID).' : ''));
  } catch (err){ alert('Could not read that file: ' + err.message); }
  e.target.value = '';
};
$('#btnClear').onclick = () => { if (confirm('Remove all employee data from this browser?')){ DB = {}; cur = null; page = 'dash'; localStorage.removeItem('hr_db'); refreshHeader(); render(); } };

function sampleRows(){
  const base = [
    ['EMP001','Aarav Sharma','Engineering','Senior Developer','aarav@company.com','9876500001','2021-04-12','1992-08-21','Bengaluru','Meera Nair','HDFC Bank','50100123456781','HDFC0001234','ABCPS1234D','UAN1001',45000,18000,0,3000,2500,4000,0],
    ['EMP002','Priya Verma','Human Resources','HR Executive','priya@company.com','9876500002','2022-01-03','1995-02-14','Mumbai','Meera Nair','ICICI Bank','000401567890','ICIC0000004','BCDPV5678E','UAN1002',30000,12000,0,2000,2000,2500,0],
    ['EMP003','Rohan Gupta','Sales','Sales Manager','rohan@company.com','9876500003','2019-09-23','1989-11-02','Delhi','Kabir Singh','SBI','31245678901','SBIN0000691','CDEGR9012F','UAN1003',55000,22000,0,4000,3000,8000,0],

const PROFILE_FIELDS = [['name','Name'],['dept','Department'],['desig','Designation'],['email','Email'],['phone','Phone'],['doj','Date of joining'],['dob','Date of birth'],['location','Location'],['manager','Reporting manager'],['bank','Bank name'],['account','Account no.'],['ifsc','IFSC'],['pan','PAN'],['pfno','PF / UAN']].map(([key, label]) => ({key, label}));
const NUM_FIELDS = list => list.map(([key, label]) => ({key, label: label + ' (₹)', type: 'number'}));

function openForm(title, fields, vals, onSave){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<form class="mbox"><h3>${esc(title)}</h3><div class="mgrid">${fields.map(f =>
    `<label>${esc(f.label)}<input name="${esc(f.key)}" type="${f.type || 'text'}" step="any" ${f.type === 'number' ? 'min="0"' : ''} value="${esc(vals[f.key] ?? '')}" ${f.ro ? 'readonly' : ''} ${f.req ? 'required' : ''}></label>`).join('')}</div>
    <div class="row" style="justify-content:flex-end;margin:18px 0 0"><button type="button" class="btn cancel">Cancel</button><button class="btn primary">Save</button></div></form>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  m.querySelector('.cancel').onclick = close;
  m.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target), o = {};
    fields.forEach(f => o[f.key] = String(fd.get(f.key) ?? '').trim());
    if (onSave(o) !== false) close();
  };
  m.querySelector('input:not([readonly])')?.focus();
}
const saved = () => { persist(); refreshHeader(); render(); };

function editProfile(){
  const xf = Object.keys(cur.extra).map(k => ({key: 'x:' + k, label: k}));
  const vals = {...cur.info}; Object.entries(cur.extra).forEach(([k, v]) => vals['x:' + k] = v);
  openForm('Edit details — ' + cur.id, [{key:'id', label:'Employee ID', ro:true}, ...PROFILE_FIELDS, ...xf], {...vals, id: cur.id}, o => {
    for (const [k, v] of Object.entries(o)){
      if (k === 'id') continue;
      const bag = k.startsWith('x:') ? cur.extra : cur.info, key = k.replace(/^x:/, '');
      if (v) bag[key] = v; else delete bag[key];
    }
    saved();
  });
}
function addField(){
  const name = prompt('Field name (e.g. Blood Group, Emergency Contact):'); if (!name || !name.trim()) return;
  const val = prompt('Value for ' + name.trim() + ':'); if (val === null) return;
  cur.extra[name.trim()] = val.trim(); saved();
}
function delEmp(){
  if (!confirm('Delete ' + (cur.info.name || cur.id) + ' and all their records? This cannot be undone.')) return;
  delete DB[cur.id]; cur = null; $('#q').value = ''; page = 'list'; saved();
}
function editSalary(){
  const r = rec();
  openForm('Salary — ' + r.month, [...NUM_FIELDS(EARN.map(([k, l]) => [k, l])), ...NUM_FIELDS(DEDUCT.map(([k, l]) => ['d_' + k, l]))],
    {...r.earn, ...Object.fromEntries(Object.entries(r.ded).map(([k, v]) => ['d_' + k, v]))}, o => {
      EARN.forEach(([k]) => r.earn[k] = num(o[k]));
      DEDUCT.forEach(([k]) => r.ded[k] = num(o['d_' + k]));
      r.grossIn = 0; r.netIn = 0;
      saved();
    });
}
function editAttendance(){
  const r = rec(), a = r.att;
  openForm('Attendance — ' + r.month, [
    {key:'workdays', label:'Working days', type:'number'}, {key:'present', label:'Present days', type:'number'},
    {key:'absent', label:'Absent days', type:'number'}, {key:'leaves', label:'Leaves taken', type:'number'},
    {key:'halfdays', label:'Half days', type:'number'}, {key:'late', label:'Late entries', type:'number'},
    {key:'leavebal', label:'Leave balance', type:'number'}], a, o => {
      if (num(o.present) > num(o.workdays) && num(o.workdays)){ alert('Present days cannot be more than working days.'); return false; }
      ['workdays','present','absent','leaves','halfdays','late'].forEach(k => a[k] = num(o[k]));
      a.leavebal = o.leavebal === '' ? null : num(o.leavebal);
      saved();
    });
}
function addMonth(){
  const last = cur.records.at(-1), t = monthKey(last.month);
  let def = ''; if (t){ const d = new Date(t); d.setMonth(d.getMonth() + 1); def = monthLabel(d); }
  const label = (prompt('New month (e.g. Nov 2026). Salary is copied from the last month; attendance starts empty.', def) || '').trim();
  if (!label) return;
  if (cur.records.some(r => r.month === label)){ alert('That month already exists.'); return; }
  cur.records.push({month: label, earn: {...last.earn}, ded: {...last.ded}, grossIn: last.grossIn, netIn: last.netIn,
    att: {workdays:0, present:0, absent:0, leaves:0, halfdays:0, late:0, leavebal: last.att.leavebal}});
  sortRecs(cur); month = label; saved();
}
function delMonth(){
  if (cur.records.length < 2){ alert('An employee needs at least one month record.'); return; }
  if (!confirm('Delete the ' + month + ' record (salary and attendance)?')) return;
  cur.records = cur.records.filter(r => r.month !== month); month = cur.records.at(-1).month; saved();
}
$('#navAdd').onclick = () => {
  const fields = [{key:'id', label:'Employee ID *', req:true}, ...PROFILE_FIELDS, {key:'basic', label:'Basic salary (₹)', type:'number'}];
  openForm('Add employee', fields, {}, o => {
    const id = o.id.toUpperCase();
    if (DB[id]){ alert(id + ' already exists.'); return false; }
    const info = {}; PROFILE_FIELDS.forEach(f => { if (o[f.key]) info[f.key] = o[f.key]; });
    DB[id] = {id, info, extra: {}, records: [{month: monthLabel(new Date()), earn: o.basic ? {basic: num(o.basic)} : {}, ded: {}, grossIn: 0, netIn: 0,
      att: {workdays:0, present:0, absent:0, leaves:0, halfdays:0, late:0, leavebal:null}}]};
    cur = DB[id]; tab = 'profile'; page = 'emp'; month = cur.records[0].month; $('#q').value = id; saved();
  });
};
window.editCompany = () => go('co');

function viewCompany(v){
  let logo = COMPANY.logo;
  const inp = (id, label, val, ph = '') => `<label>${label}<input id="${id}" value="${esc(val)}" placeholder="${esc(ph)}"></label>`;
  v.innerHTML = `<div class="card"><p class="muted" style="margin-top:0">These details appear at the top and bottom of every payslip.</p>
    <div class="mgrid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
      ${inp('c_name', 'Company name *', COMPANY.name)}
      ${inp('c_addr', 'Address', COMPANY.addr)}
      ${inp('c_phone', 'Phone', COMPANY.phone)}
      ${inp('c_email', 'Email', COMPANY.email)}
      ${inp('c_web', 'Website', COMPANY.website)}
      ${inp('c_reg', 'Registration / GSTIN / CIN', COMPANY.regno)}
      ${inp('c_sign', 'Signatory name', COMPANY.signatory, 'e.g. Meera Nair')}
      ${inp('c_signd', 'Signatory title', COMPANY.signDesig)}
      ${inp('c_foot', 'Payslip footer note', COMPANY.footer)}
    </div>
    <div class="row" style="margin-top:18px"><div id="logoBox"></div>
      <button class="btn" id="logoPick">Upload logo</button><button class="btn danger" id="logoDel">Remove logo</button>
      <input type="file" id="logoFile" accept="image/*" hidden><span class="muted">PNG / JPG, shown on the payslip header</span></div>
    <div class="row" style="margin:22px 0 0"><button class="btn primary" id="coSave">Save company details</button><span id="coMsg" class="pill ok" hidden>Saved ✓</span></div></div>`;
  const drawLogo = () => { $('#logoBox').innerHTML = logo ? `<img src="${logo}" style="max-height:56px;max-width:160px;border:1px solid var(--line);border-radius:8px;padding:4px">` : '<span class="pill gray">No logo</span>'; };
  drawLogo();
  $('#logoPick').onclick = () => $('#logoFile').click();
  $('#logoDel').onclick = () => { logo = ''; drawLogo(); };
  $('#logoFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 300 / img.width), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      logo = c.toDataURL('image/png'); URL.revokeObjectURL(url); drawLogo();
    };
    img.onerror = () => alert('Could not read that image.');
    img.src = url;
  };
  $('#coSave').onclick = () => {
    const g = id => $(id).value.trim();
    if (!g('#c_name')){ alert('Company name is required.'); return; }
    COMPANY = {name: g('#c_name'), addr: g('#c_addr'), phone: g('#c_phone'), email: g('#c_email'), website: g('#c_web'), regno: g('#c_reg'),
      signatory: g('#c_sign'), signDesig: g('#c_signd'), footer: g('#c_foot'), logo};
    store.set('hr_company', COMPANY); refreshHeader();
    $('#coMsg').hidden = false; setTimeout(() => { const m = $('#coMsg'); if (m) m.hidden = true; }, 2000);
  };
}

/* ---------- export ---------- */
const INFO_HEADERS = {id:'Employee ID', name:'Name', dept:'Department', desig:'Designation', email:'Email', phone:'Phone', doj:'Date of Joining', dob:'Date of Birth',
  location:'Location', manager:'Reporting Manager', bank:'Bank Name', account:'Account No', ifsc:'IFSC', pan:'PAN', pfno:'PF No'};
$('#btnExport').onclick = () => {
  const emps = Object.values(DB); if (!emps.length){ alert('Nothing to export yet.'); return; }
  const rows = [];
  for (const e of emps) for (const r of e.records){
    const row = {};
    for (const [k, h] of Object.entries(INFO_HEADERS)) row[h] = k === 'id' ? e.id : (e.info[k] ?? '');
    Object.assign(row, e.extra);
    row['Month'] = r.month;
    EARN.forEach(([k, l]) => row[l] = r.earn[k] ?? 0);
    DEDUCT.forEach(([k, l]) => row[l] = r.ded[k] ?? 0);
    const a = r.att;
    Object.assign(row, {'Working Days':a.workdays, 'Present Days':a.present, 'Absent Days':a.absent, 'Leaves Taken':a.leaves, 'Half Days':a.halfdays, 'Late Entries':a.late, 'Leave Balance':a.leavebal ?? ''});
    rows.push(row);
  }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Employees');
  XLSX.writeFile(wb, 'employee_data_' + new Date().toISOString().slice(0, 10) + '.xlsx');
};

refreshHeader(); render();
